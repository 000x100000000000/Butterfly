<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="倒吊 / Hanging in a J-curve before pupating">
  <defs>
    <linearGradient id="phLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="phPupa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <!-- 枝條 / branch -->
  <path d="M4 28 Q60 34 116 24" stroke="#78350f" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M26 32 Q12 50 28 60 Q42 48 26 32 Z" fill="url(#phLeaf)" stroke="#166534" stroke-width="2"/>
  <!-- 絲 / silk -->
  <path d="M64 32 L62 48" stroke="#f5f5f4" stroke-width="2" stroke-linecap="round"/>
  <!-- J 字形倒吊的幼蟲 / larva hanging in a J-curve -->
  <path d="M62 48 Q62 62 70 68 Q76 73 74 80" stroke="#65a30d" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M62 48 Q62 62 70 68 Q76 73 74 80" stroke="#365314" stroke-width="1.6" fill="none" opacity="0.45" stroke-dasharray="6 7"/>
  <circle cx="74" cy="80" r="6" fill="#4d7c0f" stroke="#365314" stroke-width="1.8"/>
  <circle cx="76" cy="77" r="1.8" fill="#1a2e05"/>
  <!-- 旁邊已形成的蛹 / pupa beside it -->
  <g transform="translate(96,58)">
    <path d="M0 -22 Q12 -14 13 0 Q14 16 5 20 Q-4 23 -9 14 Q-13 2 -8 -12 Z" fill="url(#phPupa)" stroke="#78350f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-6 -6 Q4 0 12 -6" stroke="#fde68a" stroke-width="1.8" fill="none" opacity="0.8"/>
    <path d="M-7 6 Q4 12 12 6" stroke="#fde68a" stroke-width="1.8" fill="none" opacity="0.6"/>
    <path d="M0 -22 L-1 -30" stroke="#f5f5f4" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- J 標示 / J label -->
  <path d="M40 84 Q40 98 52 98" stroke="#0891b2" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
