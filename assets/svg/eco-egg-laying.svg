<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="產卵 / Egg-laying">
  <defs>
    <linearGradient id="elLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="elEgg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
  </defs>
  <!-- 葉片 / leaf -->
  <path d="M10 104 Q38 72 110 82 Q88 116 44 112 Q22 112 10 104 Z" fill="url(#elLeaf)" stroke="#166534" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M22 106 Q58 92 102 88" stroke="#166534" stroke-width="1.6" fill="none" opacity="0.5"/>
  <!-- 卵 / eggs on the leaf -->
  <ellipse cx="46" cy="96" rx="7" ry="9" fill="url(#elEgg)" stroke="#a16207" stroke-width="1.8"/>
  <ellipse cx="62" cy="90" rx="7" ry="9" fill="url(#elEgg)" stroke="#a16207" stroke-width="1.8"/>
  <ellipse cx="78" cy="92" rx="7" ry="9" fill="url(#elEgg)" stroke="#a16207" stroke-width="1.8"/>
  <ellipse cx="58" cy="102" rx="6" ry="7.5" fill="url(#elEgg)" stroke="#a16207" stroke-width="1.6" opacity="0.9"/>
  <!-- 產卵中的成蟲（腹部朝下） / adult laying eggs, abdomen pointing down -->
  <g transform="translate(72,46) rotate(18)">
    <path d="M-2 -2 Q-26 -20 -34 0 Q-30 14 -4 12 Z" fill="#059669" stroke="#065f46" stroke-width="2" stroke-linejoin="round"/>
    <path d="M4 -2 Q28 -20 36 0 Q32 14 6 12 Z" fill="#059669" stroke="#065f46" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-24" cy="-4" r="2.8" fill="#1c1917" opacity="0.55"/>
    <circle cx="26" cy="-4" r="2.8" fill="#1c1917" opacity="0.55"/>
    <ellipse cx="1" cy="4" rx="4.6" ry="17" fill="#0f172a"/>
    <circle cx="1" cy="-12" r="5.4" fill="#0f172a"/>
    <path d="M-2 -16 Q-7 -23 -8 -28" stroke="#0f172a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M4 -16 Q9 -23 10 -28" stroke="#0f172a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 產卵提示弧線 / laying arrow -->
  <path d="M74 66 Q74 76 72 82" stroke="#f59e0b" stroke-width="2.4" fill="none" stroke-dasharray="4 3" stroke-linecap="round"/>
  <path d="M72 80 L69 87 L76 86 Z" fill="#f59e0b"/>
</svg>
