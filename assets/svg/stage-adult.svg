<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="蝴蝶成蟲 / Adult butterfly">
  <defs>
    <linearGradient id="wFore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="wHind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- 後翅 / hindwings -->
  <path d="M58 58 Q28 60 18 82 Q30 100 54 92 Q60 76 58 58 Z" fill="url(#wHind)" stroke="#78350f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M62 58 Q92 60 102 82 Q90 100 66 92 Q60 76 62 58 Z" fill="url(#wHind)" stroke="#78350f" stroke-width="2" stroke-linejoin="round"/>
  <!-- 前翅 / forewings -->
  <path d="M56 60 Q26 34 20 54 Q22 74 52 76 Q58 70 56 60 Z" fill="url(#wFore)" stroke="#065f46" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 60 Q94 34 100 54 Q98 74 68 76 Q62 70 64 60 Z" fill="url(#wFore)" stroke="#065f46" stroke-width="2" stroke-linejoin="round"/>
  <!-- 翅脈 / wing veins -->
  <path d="M54 62 Q40 52 26 52" stroke="#ecfdf5" stroke-width="1.5" fill="none" opacity="0.55"/>
  <path d="M66 62 Q80 52 94 52" stroke="#ecfdf5" stroke-width="1.5" fill="none" opacity="0.55"/>
  <path d="M53 68 Q40 64 28 64" stroke="#ecfdf5" stroke-width="1.3" fill="none" opacity="0.4"/>
  <path d="M67 68 Q80 64 92 64" stroke="#ecfdf5" stroke-width="1.3" fill="none" opacity="0.4"/>
  <!-- 斑點 / spots -->
  <circle cx="36" cy="50" r="3" fill="#1c1917" opacity="0.65"/>
  <circle cx="84" cy="50" r="3" fill="#1c1917" opacity="0.65"/>
  <circle cx="30" cy="84" r="3.4" fill="#1c1917" opacity="0.55"/>
  <circle cx="90" cy="84" r="3.4" fill="#1c1917" opacity="0.55"/>
  <!-- 身體 / body -->
  <ellipse cx="60" cy="66" rx="6" ry="20" fill="url(#bodyGrad)"/>
  <!-- 頭部與觸角 / head & antennae -->
  <circle cx="60" cy="46" r="6" fill="#0f172a"/>
  <path d="M57 42 Q49 33 47 26" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M63 42 Q71 33 73 26" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="46" cy="25" r="2.4" fill="#0f172a"/>
  <circle cx="74" cy="25" r="2.4" fill="#0f172a"/>
  <!-- 花 / flower hint -->
  <circle cx="100" cy="104" r="3" fill="#f472b6"/>
  <circle cx="107" cy="108" r="2.4" fill="#f9a8d4"/>
  <circle cx="95" cy="110" r="2.4" fill="#f9a8d4"/>
</svg>
