<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="蝴蝶蛹（吊蛹）/ Butterfly chrysalis (pupa)">
  <defs>
    <linearGradient id="pupaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="pLeafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- 樹枝 / branch -->
  <path d="M4 34 Q60 40 116 30" stroke="#78350f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- 葉 / leaf -->
  <path d="M24 38 Q10 58 26 70 Q42 56 24 38 Z" fill="url(#pLeafGrad)" stroke="#166534" stroke-width="2"/>
  <path d="M25 42 Q26 54 26 66" stroke="#166534" stroke-width="1.3" fill="none" opacity="0.6"/>
  <!-- 絲 / silk -->
  <path d="M62 40 L60 52" stroke="#f5f5f4" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 蛹身 / pupa body -->
  <path d="M60 50 Q76 56 78 74 Q80 92 68 100 Q58 105 52 98 Q42 90 44 74 Q46 56 60 50 Z"
        fill="url(#pupaGrad)" stroke="#78350f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 蛹的斑紋 / markings -->
  <path d="M48 66 Q61 71 76 65" stroke="#fde68a" stroke-width="2.2" fill="none" opacity="0.85"/>
  <path d="M46 78 Q61 83 78 77" stroke="#fde68a" stroke-width="2.2" fill="none" opacity="0.7"/>
  <circle cx="60" cy="58" r="2.6" fill="#fef3c7" opacity="0.9"/>
  <circle cx="52" cy="88" r="2" fill="#fef3c7" opacity="0.6"/>
  <circle cx="70" cy="90" r="2" fill="#fef3c7" opacity="0.6"/>
  <!-- 翅膀輪廓透出 / wing outline showing through -->
  <path d="M52 92 Q48 78 56 72 Q64 76 62 92" fill="#78350f" opacity="0.28"/>
</svg>
